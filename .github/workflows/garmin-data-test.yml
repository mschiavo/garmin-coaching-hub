
name: Test Garmin Data

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Installa client Garmin
        run: |
          python -m pip install garmin-connect-personal-api-python

      - name: Verifica dati Garmin
        env:
          GARMIN_PERSONAL_API_KEY: ${{ secrets.GARMIN_PERSONAL_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          python - <<'PY'
          import os
          from datetime import date, timedelta
          from garmin_personal_api import (
              PersonalApiAuthenticator,
              GarminPersonalApiClient,
          )

          api_key = os.environ["GARMIN_PERSONAL_API_KEY"]

          today = date.today()
          yesterday = today - timedelta(days=1)
          start = today - timedelta(days=14)

          tests = [
              ("Attivita", "search_activities",
               {"start": 0, "limit": 10,
                "start_date": start.isoformat()}),
              ("Sonno", "get_daily_sleep",
               {"calendar_date": yesterday}),
              ("HRV", "get_daily_hrv",
               {"calendar_date": yesterday}),
              ("Body Battery", "get_daily_body_battery",
               {"start_date": yesterday, "end_date": yesterday}),
              ("Stress", "get_daily_stress",
               {"start_date": yesterday, "end_date": yesterday}),
              ("Riepilogo giornaliero", "get_daily_summaries",
               {"start_date": yesterday, "end_date": yesterday}),
          ]

          with PersonalApiAuthenticator() as auth:
              token = auth.obtain_token(api_key)

          with GarminPersonalApiClient(token.access_token) as client:
              successes = 0

              for name, method, kwargs in tests:
                  try:
                      result = getattr(client, method)(**kwargs)

                      if result is None or result == [] or result == {}:
                          status = "OK - nessun dato"
                      else:
                          status = "OK - dati presenti"

                      print(f"{name}: {status}")
                      successes += 1

                  except Exception as exc:
                      print(
                          f"{name}: ERRORE "
                          f"({type(exc).__name__})"
                      )

              print(f"\nTest completati: {successes}/{len(tests)}")

              if successes == 0:
                  raise SystemExit("Nessun endpoint funzionante.")
          PY
