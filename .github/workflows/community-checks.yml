name: Community Edition Checks
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Compile Python scripts
        run: python -m py_compile sync_garmin.py import_garmin_history.py garmin_coverage.py repair_garmin.py tools/staging_fixture.py tools/staging_probe.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
  postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      V34_TEST_DSN: host=127.0.0.1 dbname=postgres user=postgres password=synthetic-ci-only
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: |
          python -c "import os, psycopg; from psycopg import sql; c=psycopg.connect(os.environ['V34_TEST_DSN'],autocommit=True); [c.execute(sql.SQL('CREATE DATABASE {}').format(sql.Identifier(name))) for name in ('v34_fresh','v34_upgrade','gch_v341_fixture','gch_v341_upgrade')]; c.close()"
          python -m unittest discover -s tests/sql -v
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run test:load
      - run: npm run test:analytics
      - run: npx playwright install --with-deps chromium
      - run: npm run test:charts
