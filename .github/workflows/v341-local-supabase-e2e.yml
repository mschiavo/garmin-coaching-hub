name: V3.4.1 Ephemeral Supabase E2E

on:
  push:
    branches:
      - feature/v341-staging-reliability
    paths:
      - .github/workflows/v341-local-supabase-e2e.yml
      - tools/local_supabase_e2e.py
      - tools/staging_fixture.py
      - supabase/bootstrap.sql
      - supabase/dashboard.sql
      - supabase/migrations/0034_data_intelligence.sql
      - supabase/migrations/0035_staging_reliability.sql
      - dashboard/**
      - requirements.txt
      - tests/sql/**
      - tests/test_local_supabase_e2e.py
      - tests/test_staging.py
      - tests/test_v341_docker_images.sh
      - tools/v341_docker_images.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v341-local-supabase-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  local-supabase-e2e:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout source without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Test Docker image reference parser
        shell: bash
        run: bash tests/test_v341_docker_images.sh

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.8'

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.5'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3
        with:
          version: 3.4.0

      - name: Install Python and frontend dependencies
        working-directory: dashboard
        run: |
          python -m pip install -r ../requirements.txt
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Create isolated local stack configuration
        shell: bash
        run: |
          set -euo pipefail
          export GCH_SUPABASE_DIR="$RUNNER_TEMP/gch-v341-supabase"
          mkdir -m 700 -p "$GCH_SUPABASE_DIR/supabase"
          cat > "$GCH_SUPABASE_DIR/supabase/config.toml" <<'TOML'
          project_id = "gch-v341-e2e"

          [api]
          enabled = true
          port = 54321
          schemas = ["public", "graphql_public"]
          extra_search_path = ["public", "extensions"]
          max_rows = 10000

          [db]
          port = 54322
          shadow_port = 54320
          major_version = 17

          [auth]
          enabled = true
          site_url = "http://127.0.0.1:4179"
          additional_redirect_urls = ["http://127.0.0.1:4179"]
          jwt_expiry = 3600
          enable_signup = true

          [auth.email]
          enabled = true
          double_confirm_changes = false
          enable_confirmations = false

          [realtime]
          enabled = false

          [studio]
          enabled = false

          [storage]
          enabled = false

          [analytics]
          enabled = false
          TOML
          echo "GCH_SUPABASE_DIR=$GCH_SUPABASE_DIR" >> "$GITHUB_ENV"

      - name: Create loopback-only Docker bridge
        shell: bash
        run: |
          set -euo pipefail
          network_name="gch-v341-e2e-${GITHUB_RUN_ID}"
          network_id="$(docker network create \
            --driver bridge \
            --label com.gch.v341.e2e=true \
            --opt com.docker.network.bridge.host_binding_ipv4=127.0.0.1 \
            "$network_name")"
          {
            echo "GCH_DOCKER_NETWORK_NAME=$network_name"
            echo "GCH_SUPABASE_NETWORK_ID=$network_id"
          } >> "$GITHUB_ENV"
          network_check="$(docker network inspect --format '{{.Driver}}|{{index .Options "com.docker.network.bridge.host_binding_ipv4"}}|{{index .Labels "com.gch.v341.e2e"}}' "$network_id")"
          test "$network_check" = 'bridge|127.0.0.1|true'

      - name: Validate pinned local Supabase configuration
        shell: bash
        run: |
          set -euo pipefail
          cd "$GCH_SUPABASE_DIR"
          supabase config validate

      - name: Start ephemeral local Supabase services
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cd "$GCH_SUPABASE_DIR"
          # v3.4.0 defaults to upstream Dockerfile images. Pin that mode explicitly so the
          # subsequent runtime tag assertions match the CLI's embedded image manifest.
          log_file="$RUNNER_TEMP/gch-v341-supabase-start.log"
          set +e
          SUPABASE_NETWORK_ID="$GCH_SUPABASE_NETWORK_ID" SUPABASE_USE_SLIM_IMAGES=false \
            supabase start -x realtime,storage-api,imgproxy,studio,edge-runtime,logflare,vector,supavisor,postgres-meta,mailpit \
            >"$log_file" 2>&1
          exit_code=$?
          set -e
          if [ "$exit_code" -ne 0 ]; then
            category="startup_other"
            if grep -Eqi 'address already in use|port is already allocated' "$log_file"; then
              category="startup_port_conflict"
            elif grep -Eqi 'pull access denied|manifest unknown|failed to resolve reference|no matching manifest' "$log_file"; then
              category="startup_image_unavailable"
            elif grep -Eqi 'network .* not found|failed to create endpoint|network.*invalid' "$log_file"; then
              category="startup_network_error"
            elif grep -Eqi 'unhealthy|health check|healthcheck' "$log_file"; then
              category="startup_health_error"
            elif grep -Eqi 'error parsing.*config|invalid.*config|unknown key' "$log_file"; then
              category="startup_config_error"
            fi
            rm -f -- "$log_file"
            printf 'phase=startup category=%s exit_code=%s\n' "$category" "$exit_code"
            exit "$exit_code"
          fi
          rm -f -- "$log_file"
          printf 'phase=startup category=success exit_code=0\n'

      - name: Inspect ephemeral service count and states
        id: inspect-services
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t container_ids < <(docker ps -a --filter 'label=com.supabase.cli.project=gch-v341-e2e' --format '{{.ID}}')
          count=${#container_ids[@]}
          running=0
          stopped=0
          for container_id in "${container_ids[@]}"; do
            state="$(docker inspect --format '{{.State.Status}}' "$container_id")"
            if [ "$state" = running ]; then running=$((running + 1)); else stopped=$((stopped + 1)); fi
          done
          printf 'phase=container_inventory category=observed container_count=%s running_count=%s stopped_count=%s\n' "$count" "$running" "$stopped"
          if [ "$count" -ne 4 ]; then
            printf 'phase=container_inventory category=container_count_mismatch exit_code=1\n'
            exit 1
          fi
          if [ "$running" -ne 4 ]; then
            printf 'phase=container_inventory category=container_not_running exit_code=1\n'
            exit 1
          fi
          printf 'GCH_E2E_CONTAINER_IDS=%s\n' "${container_ids[*]}" >> "$GITHUB_ENV"
          printf 'phase=container_inventory category=success exit_code=0\n'

      - name: Verify pinned service image tags
        id: verify-images
        shell: bash
        run: |
          set -euo pipefail
          source tools/v341_docker_images.sh
          postgres_ok=false; auth_ok=false; rest_ok=false; kong_ok=false
          postgres_id=""
          image_refs=()
          for container_id in $GCH_E2E_CONTAINER_IDS; do
            image_ref="$(docker inspect --format '{{.Config.Image}}' "$container_id")"
            if ! v341_parse_docker_image_ref "$image_ref"; then
              printf 'phase=image_refs category=malformed_image_reference exit_code=1\n'
              exit 1
            fi
            # Print only the validated .Config.Image field; no container metadata is exposed.
            printf 'phase=image_refs docker_image_ref=%s\n' "$image_ref"
            image_refs+=("$image_ref")
            if v341_is_postgrest_candidate; then
              registry_ok=false; repository_ok=false; tag_ok=false
              v341_postgrest_registry_ok && registry_ok=true
              v341_postgrest_repository_ok && repository_ok=true
              v341_postgrest_tag_ok && tag_ok=true
              printf 'phase=image_components service=postgrest registry_ok=%s repository_ok=%s tag_ok=%s\n' "$registry_ok" "$repository_ok" "$tag_ok"
              if v341_postgrest_reference_ok; then rest_ok=true; fi
            fi
            case "$image_ref" in
              */supabase/postgres:17.12.0.002|supabase/postgres:17.12.0.002) postgres_ok=true; postgres_id="$container_id" ;;
              */supabase/gotrue:v2.198.0|supabase/gotrue:v2.198.0) auth_ok=true ;;
              */kong:2.8.1|kong:2.8.1) kong_ok=true ;;
            esac
          done
          postgrest_ref_count="$(v341_count_postgrest_candidates "${image_refs[@]}")"
          if ! v341_exactly_one_postgrest_candidate "$postgrest_ref_count"; then
            printf 'phase=image_components service=postgrest category=postgrest_reference_count_mismatch count=%s exit_code=1\n' "$postgrest_ref_count"
            exit 1
          fi
          printf 'phase=image_tags postgres_ok=%s auth_ok=%s rest_ok=%s kong_ok=%s\n' "$postgres_ok" "$auth_ok" "$rest_ok" "$kong_ok"
          if [ "$postgres_ok" != true ] || [ "$auth_ok" != true ] || [ "$rest_ok" != true ] || [ "$kong_ok" != true ]; then
            printf 'phase=image_tags category=image_tag_mismatch exit_code=1\n'
            exit 1
          fi
          printf 'GCH_E2E_POSTGRES_CONTAINER_ID=%s\n' "$postgres_id" >> "$GITHUB_ENV"
          printf 'phase=image_tags category=success exit_code=0\n'

      - name: Verify isolated network and loopback-only ports
        shell: bash
        run: |
          set -euo pipefail
          network_ok=true
          loopback_ok=true
          published_port_count=0
          for container_id in $GCH_E2E_CONTAINER_IDS; do
            if ! docker inspect --format '{{range $name, $network := .NetworkSettings.Networks}}{{printf "%s\n" $network.NetworkID}}{{end}}' "$container_id" | grep -Fxq "$GCH_SUPABASE_NETWORK_ID"; then network_ok=false; fi
            ports="$(docker inspect --format '{{json .NetworkSettings.Ports}}' "$container_id")"
            this_count="$(printf '%s\n' "$ports" | jq '[to_entries[] | select(.value != null) | .value[]] | length')"
            published_port_count=$((published_port_count + this_count))
            if ! printf '%s\n' "$ports" | jq -e 'to_entries | all(.[]; .value == null or all(.value[]; .HostIp == "127.0.0.1"))' >/dev/null; then loopback_ok=false; fi
          done
          printf 'phase=network network_ok=%s loopback_ok=%s published_port_count=%s\n' "$network_ok" "$loopback_ok" "$published_port_count"
          if [ "$network_ok" != true ]; then printf 'phase=network category=network_mismatch exit_code=1\n'; exit 1; fi
          if [ "$loopback_ok" != true ] || [ "$published_port_count" -eq 0 ]; then printf 'phase=network category=port_binding_invalid exit_code=1\n'; exit 1; fi
          printf 'phase=network category=success exit_code=0\n'

      - name: Install SQL, create synthetic fixture and exercise Auth and REST
        shell: bash
        run: |
          set -euo pipefail
          GCH_E2E_EXPECTED_SYSTEM_ID="$(docker exec "$GCH_E2E_POSTGRES_CONTAINER_ID" psql -X -U postgres -d postgres -Atqc 'SELECT system_identifier::text FROM pg_catalog.pg_control_system()')"
          test -n "$GCH_E2E_EXPECTED_SYSTEM_ID"
          export GCH_E2E_EXPECTED_SYSTEM_ID
          GCH_SUPABASE_DIR="$GCH_SUPABASE_DIR" python tools/local_supabase_e2e.py

      - name: Stop stack and remove synthetic credentials
        if: always()
        shell: bash
        run: |
          set +e
          if [ -z "${GCH_SUPABASE_DIR:-}" ]; then exit 0; fi
          if [ "${GCH_SUPABASE_DIR:-}" != "$RUNNER_TEMP/gch-v341-supabase" ]; then
            echo "Refusing cleanup outside the workflow temporary project directory."
            exit 1
          fi
          if [ -d "$GCH_SUPABASE_DIR" ]; then
            (cd "$GCH_SUPABASE_DIR" && supabase stop --no-backup) > /dev/null 2>&1
          fi
          rm -f -- "$RUNNER_TEMP/gch-v341-supabase-start.log"
          if [ -n "${GCH_DOCKER_NETWORK_NAME:-}" ]; then
            network_check="$(docker network inspect --format '{{.Driver}}|{{index .Options "com.docker.network.bridge.host_binding_ipv4"}}|{{index .Labels "com.gch.v341.e2e"}}' "$GCH_DOCKER_NETWORK_NAME" 2>/dev/null)"
            if [ "$network_check" = 'bridge|127.0.0.1|true' ]; then
              docker network rm "$GCH_DOCKER_NETWORK_NAME" > /dev/null 2>&1
            fi
          fi
          rm -rf -- "$RUNNER_TEMP/gch-v341-supabase"
