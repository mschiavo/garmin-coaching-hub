name: V3.4.1 Ephemeral Supabase E2E

on:
  push:
    branches:
      - feature/v341-staging-reliability
    paths:
      - .github/workflows/v341-local-supabase-e2e.yml
      - tools/local_supabase_e2e.py
      - tools/staging_fixture.py
      - supabase/bootstrap.sql
      - supabase/dashboard.sql
      - supabase/migrations/0034_data_intelligence.sql
      - supabase/migrations/0035_staging_reliability.sql
      - dashboard/**
      - requirements.txt
      - tests/sql/**
      - tests/test_local_supabase_e2e.py
      - tests/test_staging.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v341-local-supabase-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  local-supabase-e2e:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout source without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.8'

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.5'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3
        with:
          version: 3.4.0

      - name: Install Python and frontend dependencies
        working-directory: dashboard
        run: |
          python -m pip install -r ../requirements.txt
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Create isolated local stack configuration
        shell: bash
        run: |
          set -euo pipefail
          export GCH_SUPABASE_DIR="$RUNNER_TEMP/gch-v341-supabase"
          mkdir -m 700 -p "$GCH_SUPABASE_DIR/supabase"
          cat > "$GCH_SUPABASE_DIR/supabase/config.toml" <<'TOML'
          project_id = "gch-v341-e2e"

          [api]
          enabled = true
          port = 54321
          schemas = ["public", "graphql_public"]
          extra_search_path = ["public", "extensions"]
          max_rows = 10000
          image = "postgrest/postgrest:v14.18"
          kong_image = "kong/kong:3.9.5"

          [db]
          port = 54322
          shadow_port = 54320
          major_version = 17
          image = "supabase/postgres:17.6.1.136"

          [auth]
          enabled = true
          site_url = "http://127.0.0.1:4179"
          additional_redirect_urls = ["http://127.0.0.1:4179"]
          jwt_expiry = 3600
          enable_signup = true
          image = "supabase/gotrue:v2.198.0"

          [auth.email]
          enable_signup = true
          double_confirm_changes = false
          enable_confirmations = false

          [realtime]
          enabled = false

          [studio]
          enabled = false

          [storage]
          enabled = false

          [analytics]
          enabled = false
          TOML
          echo "GCH_SUPABASE_DIR=$GCH_SUPABASE_DIR" >> "$GITHUB_ENV"

      - name: Validate pinned local Supabase configuration
        shell: bash
        run: |
          set -euo pipefail
          cd "$GCH_SUPABASE_DIR"
          supabase config validate

      - name: Start ephemeral local Supabase services
        shell: bash
        run: |
          set -euo pipefail
          cd "$GCH_SUPABASE_DIR"
          if ! supabase start -x realtime,storage-api,imgproxy,studio,edge-runtime,logflare,vector,supavisor,postgres-meta,mailpit > /dev/null 2>&1; then
            echo "Local Supabase stack startup failed; service output is intentionally withheld."
            exit 1
          fi
          printf 'GCH_SUPABASE_DIR=%s\n' "$GCH_SUPABASE_DIR" >> "$GITHUB_ENV"

      - name: Install SQL, create synthetic fixture and exercise Auth and REST
        shell: bash
        run: |
          set -euo pipefail
          GCH_E2E_EXPECTED_SYSTEM_ID="$(docker ps --filter ancestor=supabase/postgres:17.6.1.136 --format '{{.ID}}' | while read -r id; do docker exec "$id" psql -X -U postgres -d postgres -Atqc 'SELECT system_identifier::text FROM pg_catalog.pg_control_system()'; done)"
          test "$(printf '%s\n' "$GCH_E2E_EXPECTED_SYSTEM_ID" | wc -l)" -eq 1
          export GCH_E2E_EXPECTED_SYSTEM_ID
          GCH_SUPABASE_DIR="$GCH_SUPABASE_DIR" python tools/local_supabase_e2e.py

      - name: Stop stack and remove synthetic credentials
        if: always()
        shell: bash
        run: |
          set +e
          if [ -z "${GCH_SUPABASE_DIR:-}" ]; then exit 0; fi
          if [ "${GCH_SUPABASE_DIR:-}" != "$RUNNER_TEMP/gch-v341-supabase" ]; then
            echo "Refusing cleanup outside the workflow temporary project directory."
            exit 1
          fi
          if [ -d "$GCH_SUPABASE_DIR" ]; then
            (cd "$GCH_SUPABASE_DIR" && supabase stop --no-backup) > /dev/null 2>&1
          fi
          rm -rf -- "$RUNNER_TEMP/gch-v341-supabase"
