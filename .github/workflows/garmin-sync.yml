
name: Garmin Supabase Sync

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Numero di giorni da sincronizzare"
        required: true
        default: "3"
        type: choice
        options:
          - "3"
          - "7"
          - "14"
          - "31"

  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: read

concurrency:
  group: garmin-database-writer
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Sincronizza Garmin con Supabase
        env:
          GARMIN_PERSONAL_API_KEY: ${{ secrets.GARMIN_PERSONAL_API_KEY }}
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          SYNC_DAYS: ${{ inputs.days || '3' }}
          GARMIN_TIMEZONE: ${{ vars.GARMIN_TIMEZONE || 'Europe/Rome' }}
        run: python sync_garmin.py
      - name: Segnala un'importazione non completata
        if: ${{ failure() }}
        run: echo 'Import con errori. Il riepilogo riporta gli esiti aggregati disponibili.' >> "$GITHUB_STEP_SUMMARY"
