name: Garmin History Import
on:
  workflow_dispatch:
    inputs:
      month:
        description: 'Mese da importare (YYYY-MM, non futuro)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: garmin-database-writer
  cancel-in-progress: false
jobs:
  import-history:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Import Garmin history
        env:
          GARMIN_PERSONAL_API_KEY: ${{ secrets.GARMIN_PERSONAL_API_KEY }}
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          IMPORT_MONTH: ${{ inputs.month }}
          GARMIN_TIMEZONE: ${{ vars.GARMIN_TIMEZONE || 'Europe/Rome' }}
        run: python import_garmin_history.py
      - name: Segnala un'importazione non completata
        if: ${{ failure() }}
        run: echo 'Import con errori. Il riepilogo riporta gli esiti aggregati disponibili.' >> "$GITHUB_STEP_SUMMARY"
