
name: Garmin History Import

on:
  workflow_dispatch:
    inputs:
      month:
        description: "Mese del 2026 da importare"
        required: true
        type: choice
        default: "2026-01"
        options:
          - "2026-01"
          - "2026-02"
          - "2026-03"
          - "2026-04"
          - "2026-05"
          - "2026-06"
          - "2026-07"
          - "2026-08"
          - "2026-09"
          - "2026-10"
          - "2026-11"
          - "2026-12"

permissions:
  contents: read

concurrency:
  group: garmin-database-writer
  cancel-in-progress: false

jobs:
  import-history:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Import Garmin history
        env:
          GARMIN_PERSONAL_API_KEY: ${{ secrets.GARMIN_PERSONAL_API_KEY }}
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          IMPORT_MONTH: ${{ inputs.month }}
        run: |
          python import_garmin_history.py
