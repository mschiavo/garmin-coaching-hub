
name: Test Garmin HTTPS

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Verifica HTTPS Garmin
        run: |
          echo "Test Garmin Connect"
          curl -sS -o /dev/null \
            -w "HTTP: %{http_code}\n" \
            --max-time 20 \
            https://connect.garmin.com/

          echo "Test Garmin Personal API"
          curl -sS -o /dev/null \
            -w "HTTP: %{http_code}\n" \
            --max-time 20 \
            https://personal.connectapi.garmin.com/
